<html>
<head>
  <meta charset="utf-8">
  <title>Site documentation — one link, always current</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Site documentation — one link, always current...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

econdary:hover { border-color: #7d98ae; color: #ffffff; }\n  .tv-demo-link:hover { color: #ffffff; }\n  .tv-grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }\n  .tv-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }\n  .tv-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }\n  .tv-hero-field { position: absolute; right: 0; top: 0; height: 100%; width: 56%; object-fit: cover; object-position: right center; }\n  @media (max-width: 900px) {\n    .tv-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n    .tv-grid-3 { grid-template-columns: minmax(0, 1fr); }\n    .tv-grid-2 { grid-template-columns: minmax(0, 1fr); }\n  }\n  @media (max-width: 600px) {\n    .tv-hero-field { display: none; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width: 100%; min-height: 100vh; background: #0b1c28; font-family: Lexend, 'Segoe UI', Calibri, system-ui, sans-serif; color: #f2f5f7; box-sizing: border-box;\">\n\n  <!-- SiteHeader -->\n  <header style=\"border-bottom: 1px solid #24405a;\">\n    <div class=\"tv-container\" style=\"display: flex; align-items: center; justify-content: space-between; height: 76px;\">\n      <img src=\"79fdc7c1-1cba-4a14-affa-2e04e0fbf0a2\" alt=\"three vertex\" style=\"height: 28px;\">\n      <nav class=\"tv-nav\" style=\"display: flex; align-items: center; gap: 32px;\">\n        <a href=\"#how-it-works\">How it works<\u002Fa>\n        <a href=\"#who-its-for\">Who it's for<\u002Fa>\n        <a href=\"#faq\">FAQ<\u002Fa>\n      <\u002Fnav>\n      <a href=\"#get-started\" class=\"tv-btn-primary\" style=\"background: #ff9d55; color: #1f4260; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 4px; text-decoration: none;\">Get a scan<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- Hero -->\n  <section style=\"position: relative; overflow: hidden; padding: 96px 0;\">\n    <img src=\"da4abb97-913f-4e0a-b75e-6a3801430526\" alt=\"\" class=\"tv-hero-field\">\n    <div class=\"tv-container\" style=\"position: relative;\">\n      <div style=\"max-width: 620px; display: flex; flex-direction: column; gap: 24px;\">\n        <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #ff9d55;\">A clearer record<\u002Fspan>\n        <h1 style=\"margin: 0; font-size: 72px; line-height: 0.98; font-weight: 700; letter-spacing: -0.02em; color: #ffffff;\">A walkthrough file, <em style=\"font-style: normal; color: #ff9d55;\">yours to keep<\u002Fem><\u002Fh1>\n        <p style=\"margin: 0; font-size: 20px; line-height: 1.5; font-weight: 300; color: #f2f5f7; max-width: 52ch;\">Stop hunting through WhatsApp threads and old email attachments for what a site looked like last month. You get a single exported file — open it anywhere, no app, nothing hosted.<\u002Fp>\n        <div style=\"display: flex; gap: 16px; margin-top: 8px;\">\n          <a href=\"#demo\" class=\"tv-btn-primary\" style=\"background: #ff9d55; color: #1f4260; font-size: 16px; font-weight: 600; padding: 14px 28px; border-radius: 4px; text-decoration: none;\">See it in action<\u002Fa>\n          <a href=\"#get-started\" class=\"tv-btn-secondary\" style=\"border: 1px solid #4a6378; color: #f2f5f7; font-size: 16px; font-weight: 500; padding: 14px 28px; border-radius: 4px; text-decoration: none;\">Get a scan<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- The problem -->\n  <section style=\"padding: 0 0 64px;\">\n    <div class=\"tv-container\">\n      <div style=\"background: #13293a; border: 1px solid #24405a; border-radius: 4px; padding: 48px; display: flex; flex-direction: column; gap: 16px; max-width: 760px;\">\n        <h2 style=\"margin: 0; font-size: 30px; font-weight: 600; color: #ffffff;\">The scramble you already know<\u002Fh2>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #f2f5f7; max-width: 68ch;\">You visit a site, take some photos, send them over WhatsApp or email. To point out what needs fixing, you paste the photo into a PowerPoint slide and draw a circle or a text box over it — one slide per issue, one file per round of comments. Weeks later someone asks what a corner looked like before the work started, and you're scrolling through old chats and old decks hoping you saved the right ones.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- What it is -->\n  <section style=\"padding: 0 0 64px;\">\n    <div class=\"tv-container\">\n      <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px;\">\n        <h2 style=\"margin: 0; font-size: 30px; font-weight: 600; color: #ffffff;\">What you get<\u002Fh2>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #f2f5f7; max-width: 68ch;\">A walkthrough file for your site, plus the raw capture behind it. Open the walkthrough in any browser — nothing installed, nothing hosted, nothing that stops working if a subscription lapses. It's yours, the same way a PDF or a photo is yours.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Live demo -->\n  <section id=\"demo\" style=\"padding: 0 0 64px;\">\n    <div class=\"tv-container\">\n      <div style=\"background: #13293a; border: 1px solid #24405a; border-radius: 4px; padding: 48px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <h2 style=\"margin: 0; font-size: 30px; font-weight: 600; color: #ffffff;\">See it for yourself<\u002Fh2>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #a3b1bd; max-width: 68ch;\">This is a live example, not a rendering — move around it the way anyone you send the link to would.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: #0b1c28; border: 1px solid #24405a; border-radius: 4px; height: 420px; display: flex; align-items: center; justify-content: center;\">\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 16px;\">\n            <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a3b1bd;\">Interactive walkthrough<\u002Fspan>\n            <a href=\"https://gsplat.threevertex.co/demo/view1.html\" class=\"tv-demo-link\" style=\"color: #ff9d55; font-size: 18px; font-weight: 600; text-decoration: none;\">Open the live demo →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Who it's for -->\n  <section id=\"who-its-for\" style=\"padding: 0 0 64px;\">\n    <div class=\"tv-container\">\n      <h2 style=\"margin: 0 0 32px; font-size: 30px; font-weight: 600; color: #ffffff;\">Who it's for<\u002Fh2>\n      <div class=\"tv-grid-4\">\n\n        <div style=\"border: 1px solid #24405a; border-radius: 4px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; flex-shrink: 0;\"><\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: #a3b1bd;\">01<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">You keep a running photo record of a site, and can never find the shot you actually need.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"border: 1px solid #24405a; border-radius: 4px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; flex-shrink: 0;\"><\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: #a3b1bd;\">02<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">You keep re-explaining what a place looked like to people who weren't there.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"border: 1px solid #24405a; border-radius: 4px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; flex-shrink: 0;\"><\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: #a3b1bd;\">03<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">Your team or client keeps asking you to resend photos you already sent.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"border: 1px solid #24405a; border-radius: 4px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; flex-shrink: 0;\"><\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: #a3b1bd;\">04<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">You want one thing to hand someone, not a folder of files.<\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- How it works -->\n  <section id=\"how-it-works\" style=\"padding: 0 0 64px;\">\n    <div class=\"tv-container\">\n      <h2 style=\"margin: 0 0 32px; font-size: 30px; font-weight: 600; color: #ffffff;\">How it works<\u002Fh2>\n      <div class=\"tv-grid-3\">\n\n        <div style=\"border: 1px solid #24405a; border-radius: 4px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; flex-shrink: 0;\"><\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: #a3b1bd;\">01<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; color: #ffffff;\">Visit &amp; capture<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">Someone visits the site and captures it — no special equipment on your end.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"border: 1px solid #24405a; border-radius: 4px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; flex-shrink: 0;\"><\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: #a3b1bd;\">02<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; color: #ffffff;\">Get your files<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">You get back an exported walkthrough file, plus the underlying capture — both yours to keep.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"border: 1px solid #24405a; border-radius: 4px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; flex-shrink: 0;\"><\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; color: #a3b1bd;\">03<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; color: #ffffff;\">Add &amp; export<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">Open the <a href=\"https://gsplat.threevertex.co/viewer/\" style=\"color: #ff9d55; text-decoration: underline;\">free viewer<\u002Fa> to add notes, then export as many versions as you need.<\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- What you can do with it -->\n  <section style=\"padding: 0 0 64px;\">\n    <div class=\"tv-container\">\n      <div style=\"background: #13293a; border: 1px solid #24405a; border-radius: 4px; padding: 48px; display: flex; flex-direction: column; gap: 32px;\">\n        <h2 style=\"margin: 0; font-size: 30px; font-weight: 600; color: #ffffff;\">What you can do with it<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <div style=\"display: flex; align-items: flex-start; gap: 14px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; margin-top: 4px; flex-shrink: 0;\"><\u002Fspan>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">Add a note on a specific spot — a flag, a measurement, a reminder.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: flex-start; gap: 14px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; margin-top: 4px; flex-shrink: 0;\"><\u002Fspan>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">Export as many annotated versions as you need — the viewer is free to use, whenever the site changes.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: flex-start; gap: 14px;\">\n            <span style=\"width: 14px; height: 14px; border-radius: 9999px; background: #ff9d55; margin-top: 4px; flex-shrink: 0;\"><\u002Fspan>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #f2f5f7;\">Open it on any phone or computer that has a browser — nothing to install, nothing hosted.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Bring your own capture -->\n  <section style=\"padding: 0 0 64px;\">\n    <div class=\"tv-container\">\n      <div style=\"background: #13293a; border: 1px solid #24405a; border-radius: 4px; padding: 48px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 640px;\">\n          <h2 style=\"margin: 0; font-size: 30px; font-weight: 600; color: #ffffff;\">Already have a capture of your own?<\u002Fh2>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #f2f5f7;\">The viewer isn't only for sites we've scanned for you. Open any gsplat capture you already have and add your own notes to it — no scan needed from us, and free to use.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <a href=\"https://gsplat.threevertex.co/viewer/\" class=\"tv-btn-secondary\" style=\"border: 1px solid #4a6378; color: #f2f5f7; font-size: 16px; font-weight: 500; padding: 14px 28px; border-radius: 4px; text-decoration: none; display: inline-block;\">Open the free viewer →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section id=\"faq\" style=\"padding: 0 0 64px;\">\n    <div class=\"tv-container\">\n      <h2 style=\"margin: 0 0 32px; font-size: 30px; font-weight: 600; color: #ffffff;\">Questions<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column;\">\n\n        <div style=\"padding: 24px 0; border-bottom: 1px solid #24405a; display: flex; flex-direction: column; gap: 8px;\">\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; color: #ffffff;\">What is this, technically?<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #a3b1bd; max-width: 68ch;\">It's built on Gaussian splatting — a point-based method for capturing a real space that renders directly in a browser, without the plugins or heavy software most 3D capture tools need.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"padding: 24px 0; border-bottom: 1px solid #24405a; display: flex; flex-direction: column; gap: 8px;\">\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; color: #ffffff;\">Do I need any special equipment or app?<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #a3b1bd; max-width: 68ch;\">No app for viewing — the link opens in any modern browser. Capturing the site is handled for you, so you don't need your own scanning equipment to get one made.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"padding: 24px 0; border-bottom: 1px solid #24405a; display: flex; flex-direction: column; gap: 8px;\">\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; color: #ffffff;\">Can I update it later, or is it a one-time thing?<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #a3b1bd; max-width: 68ch;\">Yes. The <a href=\"https://gsplat.threevertex.co/viewer/\" style=\"color: #ff9d55; text-decoration: underline;\">viewer<\u002Fa> that comes with your file is free to use, so you can go back in, add new notes, and export another version whenever you like — no subscription, nothing that can expire.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"padding: 24px 0; border-bottom: 1px solid #24405a; display: flex; flex-direction: column; gap: 8px;\">\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; color: #ffffff;\">Who can see the file?<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #a3b1bd; max-width: 68ch;\">Only whoever you send it to. It's a file you hold and share yourself — not something hosted or listed anywhere.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"padding: 24px 0; display: flex; flex-direction: column; gap: 8px;\">\n          <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; color: #ffffff;\">How is this different from just sending photos?<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #a3b1bd; max-width: 68ch;\">A photo shows one angle someone chose in the moment. This shows the whole space, so the person on the other end can look at what they actually need to see — not just what you remembered to point the camera at.<\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Get started -->\n  <section id=\"get-started\" style=\"padding: 0 0 96px;\">\n    <div class=\"tv-container\">\n      <div style=\"background: #13293a; border: 1px solid #24405a; border-radius: 4px; padding: 48px; display: flex; flex-direction: column; gap: 32px; max-width: 640px; margin: 0 auto;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px; text-align: center;\">\n          <h2 style=\"margin: 0; font-size: 30px; font-weight: 600; color: #ffffff;\">Get a scan for your site<\u002Fh2>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #a3b1bd;\">Tell us where the site is, and we'll set up a first capture.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <label for=\"tv-name\" style=\"font-size: 14px; color: #a3b1bd;\">Name<\u002Flabel>\n            <input id=\"tv-name\" type=\"text\" placeholder=\"Your name\" style=\"background: #0b1c28; border: 1px solid #7d98ae; border-radius: 2px; padding: 12px 14px; color: #f2f5f7; font-size: 16px; font-family: Lexend, sans-serif;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <label for=\"tv-contact\" style=\"font-size: 14px; color: #a3b1bd;\">Phone or email<\u002Flabel>\n            <input id=\"tv-contact\" type=\"text\" placeholder=\"How we should reach you\" style=\"background: #0b1c28; border: 1px solid #7d98ae; border-radius: 2px; padding: 12px 14px; color: #f2f5f7; font-size: 16px; font-family: Lexend, sans-serif;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <label for=\"tv-site\" style=\"font-size: 14px; color: #a3b1bd;\">Site location<\u002Flabel>\n            <input id=\"tv-site\" type=\"text\" placeholder=\"Where is the site\" style=\"background: #0b1c28; border: 1px solid #7d98ae; border-radius: 2px; padding: 12px 14px; color: #f2f5f7; font-size: 16px; font-family: Lexend, sans-serif;\">\n          <\u002Fdiv>\n          <button type=\"button\" style=\"background: #ff9d55; color: #1f4260; font-size: 16px; font-weight: 600; padding: 14px 28px; border: none; border-radius: 4px; cursor: pointer; font-family: Lexend, sans-serif;\">Request a scan<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Footer -->\n  <footer style=\"border-top: 1px solid #24405a; padding: 32px 0;\">\n    <div class=\"tv-container\" style=\"display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;\">\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <img src=\"c2c8f06a-f99b-4f00-8f13-15379e7ded7f\" alt=\"three vertex\" style=\"height: 20px;\">\n        <span style=\"font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a3b1bd;\">Spatial, made simple.<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size: 14px; color: #a3b1bd;\">info@threevertex.co<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
